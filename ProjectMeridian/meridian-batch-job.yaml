apiVersion: batch/v1
kind: Job
metadata:
  name: meridian-batch
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: batch
          image: meridian-batch:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi

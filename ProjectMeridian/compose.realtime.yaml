services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic shipment-tracking-live --partitions 1 --replication-factor 1
    restart: "no"

  stream:
    hostname: meridian-stream
    build:
      context: .
      dockerfile: meridian-stream.Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: shipment-tracking-live
      MERIDIAN_STREAM_MODE: continuous
      MERIDIAN_TRIGGER_INTERVAL: ${MERIDIAN_TRIGGER_INTERVAL:-2 seconds}
      MERIDIAN_MAX_OFFSETS_PER_TRIGGER: ${MERIDIAN_MAX_OFFSETS_PER_TRIGGER:-100}
      MERIDIAN_CHECKPOINT: /meridian/checkpoints/live_event_windows
      MERIDIAN_WAREHOUSE: file:///meridian/live-warehouse
    volumes:
      - meridian-state:/meridian
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/meridian-stream-ready && kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: unless-stopped

volumes:
  kafka-data:
  meridian-state:
